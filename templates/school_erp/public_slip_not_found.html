<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ slip_type|default:"Document" }} Not Found - {{ school.name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fef2f2;
      color: #ef4444;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h2 style="font-weight:800; margin-bottom:8px; color:#0f172a;">{{ slip_type }} Not Found</h2>
    <p style="color:#64748b; font-size:0.9rem; margin-bottom:20px;">
      The requested {{ slip_type|lower }} <strong>{{ number }}</strong> could not be found or may have been updated.
    </p>
    <div style="font-size:0.8rem; color:#94a3b8; border-top:1px solid #f1f5f9; padding-top:14px;">
      Please contact <strong>{{ school.name }}</strong> Accounts Office at {{ school.phone }}.
    </div>
  </div>
</body>
</html>
